# Alembic Configuration File

[alembic]
# The location of the migration files
script_location = %(here)s/app/migrations

# The SQLAlchemy connection string.
# This value is overridden by app config during Flask-Migrate runtime.
sqlalchemy.url = postgresql://horse_races_admin:hr_pass@localhost:5432/horse_races

# The encoding of files to use.
file_encoding = utf-8

# A Python logging.config fileConfig() call to configure logging.
[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
